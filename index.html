<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>

header{
    display: flex;
    justify-content: space-between;
    align-items: center;
}
header h1{
   cursor: pointer; 
}
.nav a.home{
    color:rgb(18, 161, 18) ;
}
.nav{
    display: flex;
    gap: 25px;
}
.nav a{
    text-decoration: none;
    color: black;
   font-size: 15px;
}
.nav a:hover{
  color: rgb(18, 161, 18);
}
.icons{
    display: flex;
    gap: 25px;
    cursor: pointer;
}
.icons i:hover{
  color: rgb(18, 161, 18);
}
.container{
    display: flex;
    gap: 20px;
    margin: 0 10px;
}

.container img{
    width: 100%;
    height: 350px;
    object-fit: cover;
    display: block;
}

.dropdown{
    position: relative;
     list-style: none  ;
}
.menu{
    display: none;
    position:absolute;
    z-index: 3;
    top: 100%;
    left: 0;
    background-color: white;
    margin: 0;
    padding: 0;
    list-style: none;
    width: 200px;
   
}
.dropdown:hover .menu{
    display:block;
   
}

.subdropdown{
    position: relative;
}
.submenu{
    display: none;
    position: absolute;
    z-index: 3;
    top: 0;
    left: 100%;
    margin: 0;
    padding: 0;
    background-color: white;
    width: 120px;
    list-style: none;

}

.subdropdown:hover .submenu{
    display: block;
}
.menu> li{
    padding: 8px 10px;
    cursor: pointer;
}
.submenu li{
    padding: 8px 10px;
}
.menu li:hover{
    background-color: #f2f2f2;
}
.dropdown i{
    font-size: 10px;
    margin-left: 5px;
}
.subdropdown i{
    margin-left: 100px;
}

.img1,
.img2,
.img3{
    position: relative;
    flex: 1;

}


.content{
position: absolute;
z-index: 1;
top: 30%;
left: 30%;
text-align: center;

}


.container h1{
    color: white;
}
.container button{
    padding: 10px;
    width: 150px;
    border-color: white;
    background-color: transparent;
    color: white;
    font-size: 12px;
    cursor: pointer;

}
.container button:hover{
    background-color: white;
    color: black;
}
.overlay{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    opacity: 0;
}
.img1:hover .overlay,
.img2:hover .overlay,
.img3:hover .overlay{
    opacity: 0.4;
}
</style>


</head>

<body>
<header>
<h1>Photon</h1>
<div class="nav">
<a class="home" href="#">HOME</a>
<li class="dropdown">
    <a href="#">GALLERY<i class="fa-solid fa-chevron-down"></i></a>
    <ul class="menu">
<li>Nature</li>
<li>Portrait</li>
<li>People</li>
<li>Architecture</li>
<li>Animals</li>
<li>Sports</li>
<li>Travel</li>
<li class="subdropdown">Sub Menu<i class="fa-solid fa-chevron-right"></i>
    <ul class="submenu">
        <li>Menu One</li>
        <li>Menu Two</li>
        <li>Menu Three</li>
    </ul>
</li>
  </ul>
</li>


<a href="#">SERVICES</a>
<a href="#">BLOG</a>
<a href="#">ABOUT</a>
<a href="#">REVIEWS</a>
<a href="#">CONTACT</a>
</div>
<div class="icons">
<i class="fa-brands fa-facebook-f"></i>
<i class="fa-brands fa-twitter"></i>
<i class="fa-brands fa-instagram"></i>
<i class="fa-brands fa-youtube"></i>
</div>
</header>
<div class="container">
<div class="img1">
<img src="images/1.png" alt="image not found">
<div class="overlay"></div>
<div class="content">
<h1>Nature</h1>
<button>MORE PHOTOS</button>
</div>
</div>


<div class="img2">
<img src="images/2.jpg" alt="image not found">
<div class="overlay"></div>
<div class="content">
<h1>Portrait</h1>
<button>MORE PHOTOS</button>
</div>
</div>


<div class="img3">
<img src="images/3.png" alt="image not found">
<div class="overlay"></div>
<div class="content">
<h1>People</h1>
<button>MORE PHOTOS</button>
</div>
</div>


</div>
</body>
</html>
